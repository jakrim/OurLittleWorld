# Birthday-first discovery must visibly report private work without forcing a
# second decision while the bounded automatic pass is still running.
appId: com.jessekrim.ourlittleworld
---
- openLink: "ourlittleworld://timeline"
- openLink: "ourlittleworld://reference?progressPreview=1"
- assertVisible: "Finding Test Child."
- assertVisible:
    id: "birthday-discovery-progress"
- scrollUntilVisible:
    element:
      text: "Back"
    direction: DOWN
    timeout: 30000
- assertVisible: "Back"
