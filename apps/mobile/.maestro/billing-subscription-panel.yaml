# Billing settings: the Subscription row expands its detail panel immediately
# under the row, so the tap has an obvious result before the remaining billing
# links.
appId: com.jessekrim.ourlittleworld
---
- openLink: "ourlittleworld://today"
- extendedWaitUntil:
    visible: "Open settings"
    timeout: 15000
- tapOn:
    point: "89%,11%"
- extendedWaitUntil:
    visible: "Test Child profile.*"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "BILLING"
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
- tapOn:
    text: "Subscription.*"
- assertVisible: "Family access"
- assertVisible: "Gift, website, or partner code"
