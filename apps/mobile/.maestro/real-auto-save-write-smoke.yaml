# Real-write smoke: this route accepts local Supabase or one exact hosted QA
# project compiled into the development build. Production is always denied.
appId: com.jessekrim.ourlittleworld
---
- stopApp
- launchApp
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Allow Full Access"
    optional: true
- assertVisible: "Isolated real-write auto-save smoke."
- assertVisible: "Real-write auto-save: passed"
- assertVisible:
    text: "Upload verified.*"
- assertVisible:
    text: "Removal verified.*"
- assertVisible:
    text: "Correction verified.*"
