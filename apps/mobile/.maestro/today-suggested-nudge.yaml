# Suggested Firsts (S5): the Today day-card surfaces a pending suggestion and
# "Not now" snoozes it for 7 days without touching the Firsts card.
appId: com.jessekrim.ourlittleworld
---
- launchApp
- tapOn: "Firsts"
- longPressOn: "Add a first"
- assertVisible:
    text: "Possible first.*"
- tapOn: "Today"
- assertVisible:
    text: "Possible first.* — .* to look at"
# The day card is one accessible element, so the nested "Not now" pressable is
# flattened out of the XCUITest tree (same as catchup's "Not yet"; N3 tracks
# unflattening). Point tap is stable here because the flow pins the 16e.
- tapOn:
    point: 19%,30%
- assertNotVisible:
    text: ".* to look at"
- tapOn: "Firsts"
- assertVisible:
    text: "Possible first.*"
