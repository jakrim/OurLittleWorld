# Suggested Firsts (S4): seed a dev fixture and dismiss it. "Not this" hides
# the goal's suggestions for 30 days and survives relaunch.
appId: com.jessekrim.ourlittleworld
---
- openLink: "ourlittleworld://firsts"
- longPressOn: "Add a first"
- scrollUntilVisible:
    element:
      text: "Possible first.*"
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
- tapOn: "Not this"
- assertNotVisible:
    text: "Possible first.*"
- launchApp
- openLink: "ourlittleworld://firsts"
- assertNotVisible:
    text: "Possible first.*"
